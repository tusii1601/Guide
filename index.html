<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA Notes</title>
    <meta
      name="description"
      content="Modern DSA Pattern documentation site powered by Markdown files."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar__brand-wrap">
          <div class="brand" aria-label="DSA Notes home">
            <span class="brand__mark">&lt;</span>
            <span class="brand__text">DSA Notes</span>
            <span class="brand__mark">/&gt;</span>
          </div>
        </div>

        <div class="topbar__search-wrap">
          <button id="search-button" class="search-trigger" aria-label="Search documentation">
            <span class="search-icon">⌕</span>
            <span>Search</span>
            <span class="shortcut">Ctrl + K</span>
          </button>
        </div>

        <div class="topbar__actions">
          <a class="topbar__social" href="https://github.com" target="_blank" rel="noreferrer noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.08c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.64-1.24-1.64-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.77 2.12 3.24 1.51.1-.72.39-1.21.7-1.49-2.47-.28-5.07-1.24-5.07-5.51 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.11-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.28-2.61 5.23-5.1 5.5.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z" /></svg>
            <span class="topbar__social-label">GitHub</span>
          </a>
          <a class="topbar__social" href="https://instagram.com" target="_blank" rel="noreferrer noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="17.5" cy="6.7" r="1.2" fill="currentColor" /></svg>
            <span class="topbar__social-label">Instagram</span>
          </a>
          <button id="theme-toggle" class="icon-button" aria-label="Toggle theme">
            <span id="theme-icon">☀</span>
          </button>
          <button id="mobile-menu-toggle" class="icon-button mobile-only" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="Documentation navigation">
        <div class="sidebar__header">
          <span class="sidebar__title">DSA PATTERNS</span>
        </div>
        <nav id="sidebar-nav" class="sidebar__nav" aria-live="polite"></nav>
      </aside>

      <main id="content" class="content" aria-live="polite">
        <div id="content-inner"></div>
      </main>

      <aside id="toc" class="toc" aria-label="Table of contents">
        <div class="toc__title">ON THIS PAGE</div>
        <nav id="toc-nav" class="toc__nav"></nav>
      </aside>
    </div>

    <div id="search-overlay" class="search-overlay hidden" aria-hidden="true">
      <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search documentation">
        <div class="search-panel__input-row">
          <span class="search-icon">⌕</span>
          <input
            id="search-input"
            type="search"
            placeholder="Search documentation..."
            aria-label="Search documentation"
            autocomplete="off"
          />
        </div>
        <div id="search-results" class="search-results" aria-live="polite"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
